<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Network</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Navigation Bar -->
<nav class="navbar">
    <ul>
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="apps.html">Apps</a></li>
        <li><a href="games.html">Games</a></li>
        <li><a href="settings.html">Settings</a></li>
        <li><a href="about.html">About</a></li>
    </ul>
</nav>

        </ul>
    </nav>

    <!-- Center Content -->
    <div class="container">
        <h1 class="title">Universal Network</h1>
      

        <div class="search-box">
            <input type="text" placeholder="Search games and apps..." />
        </div>
    </div>

    <style>
    /* Background */
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        font-family: Arial, sans-serif;
        background: radial-gradient(circle at center, #0f1624 20%, #070b12 80%);
        color: white;
    }

    /* Navbar */
    .navbar {
        width: 100%;
        display: flex;
        justify-content: center;
        padding: 25px 0;
        position: absolute;
        top: 0;
    
    }


    .navbar ul {
        list-style: none;
        display: flex;
        gap: 50px;
        background: rgba(0,0,0,0.3);
        padding: 12px 35px;
        border-radius: 18px;
    }

    .navbar ul li a {
        color: #fff;
        font-weight: 500;
        text-decoration: none;
        font-size: 15px;
    }

    /* Center content */
    .container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
    }

    .title {
        font-size: 65px;
        font-weight: 800;
        color: #9e00ff;
        text-shadow: 0 0 20px #9e00ff, 0 0 40px #6b00cc;
    }

    .subtitle {
        margin-top: -10px;
        font-size: 16px;
        opacity: 0.8;
    }

    /* Search bar */
    .search-box {
        margin-top: 40px;
    }

    .search-box input {
        width: 550px;
        padding: 14px 18px;
        border-radius: 10px;
        border: 1px solid #555;
        background: rgba(255,255,255,0.1);
        color: white;
        font-size: 15px;
        outline: none;
        transition: 0.2s ease;
    }

    .search-box input:focus {
        background: rgba(255,255,255,0.2);
        border-color: #8abaff;
    }
    </style>

    <script>
    document.querySelector("input").addEventListener("keypress", e => {
        if (e.key === "Enter") {
            let query = e.target.value.trim();
            if (query !== "") {
                window.location.href = "/search?q=" + encodeURIComponent(query);
            }
        }
    });
    </script>
</body>
</html>
