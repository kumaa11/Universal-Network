<!DOCTYPE html>
<html>
<head>
    <title>Settings - Universal Network</title>
    <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<nav class="navbar">
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="apps.html">Apps</a></li>
        <li><a href="games.html">Games</a></li>
        <li><a href="settings.html" class="active">Settings</a></li>
        <li><a href="about.html">About</a></li>
    </ul>
</nav>
<h1 class="title">Settings</h1>


<div class="settings-modal">
  <div class="section">
    <h3>Theme</h3>
    <div class="theme-options">
      <button class="theme-option selected" data-theme="cyberpunk">
        <span class="dot cyberpunk"></span>
        Cyberpunk
      </button>

      <button class="theme-option" data-theme="matrix">
        <span class="dot matrix"></span>
        Matrix
      </button>

      <button class="theme-option" data-theme="sunset">
        <span class="dot sunset"></span>
        Sunset
      </button>

      <button class="theme-option" data-theme="ocean">
        <span class="dot ocean"></span>
        Ocean
      </button>
    </div>
  </div>

  <div class="section">
    <h3>Visual Effects</h3>

    <div class="toggle-row">
      <span>Particle Effects (Coming soon)</span>
      <label class="switch">
        <input type="checkbox" checked disabled>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span>Background Glow</span>
      <label class="switch">
        <input type="checkbox" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <h3>Panic Key</h3>
    <input type="text" class="input-box" value="F">

    <h3>Panic URL</h3>
    <input type="text" class="input-box" placeholder="Enter URL…">
  </div>
</div>
</body>
</html>
