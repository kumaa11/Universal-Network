    <!-- Center Content -->
    <div class="container">
        <h1 class="title">Universal Network</h1>
      

        <div class="search-box">
            <input type="text" placeholder="Search games and apps..." />
        </div>
    </div>
    <script>
    document.querySelector("input").addEventListener("keypress", e => {
        if (e.key === "Enter") {
            let query = e.target.value.trim();
            if (query !== "") {
                window.location.href = "/search?q=" + encodeURIComponent(query);
            }
        }
    });
    </script>
</body>
